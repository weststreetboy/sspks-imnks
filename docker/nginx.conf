# 容器内的站点配置，等价于 README「4. Nginx 配置」里的 server 块
# 只有两处与 README 示例不同：监听 80、php-fpm 走 127.0.0.1:9000
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/sspks-imnks;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_intercept_errors off;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    # 网页下载混淆用的内部位置，必须保留 internal
    location ^~ /_sspks_download/ {
        internal;
        alias /var/www/sspks-imnks/packages/;
        default_type application/octet-stream;
    }

    location ~ ^/(?:conf|languages|lib|runtime|vendor)(?:/|$) {
        deny all;
    }

    location ~* \.(?:ya?ml|sql|sqlite3?|log|lock|mustache)$ {
        deny all;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location = /composer.json {
        deny all;
    }

    location ^~ /packages/ {
        autoindex off;
        try_files $uri =404;
        types { application/octet-stream spk; }
    }

    location ^~ /cache/ {
        if ($uri !~* \.(?:png|webp)$) { return 404; }
        autoindex off;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
    }

    client_max_body_size 16m;
}
