name: build-and-push-ghcr

# 推 main 或打 v* 标签时构建镜像；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推 GHCR 必需

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（跨架构构建 arm64 用）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 给拉不到 ghcr.io 的网络留的后路：把 amd64 镜像打成 tar 作为 artifact
  # 下载后在 NAS 上 docker load，就能绕开拉取失败
  export-tar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 镜像（不推送，只装载到本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha

      - name: 导出为 tar.gz
        run: |
          docker save ghcr.io/${{ github.repository }}:latest | gzip -9 > sspks-imnks-amd64.tar.gz
          ls -lh sspks-imnks-amd64.tar.gz

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sspks-imnks-amd64-image
          path: sspks-imnks-amd64.tar.gz
          retention-days: 30
